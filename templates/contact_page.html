<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIZO - Contact</title>
  <link rel="stylesheet" href="../static/contact_page.css">
  <link rel="stylesheet" href="../static/nav_footer.css">
</head>
<body>
   <!-- Header -->
  <header>
    <div class="logo">PRIZO</div>
    <div class="search-bar">
      <input type="text" placeholder="Search">
      <button>Search</button>
    </div>
  </header>

  <!-- Contact Section -->
  <main>
    <section class="contact-info">
      <h1>Contact</h1>
      <p>Mobile: +91 8815259085</p>
      <p>Email: prizoshoppin@gmail.com</p>
      <p>Linkedin: www.prizo/shopping47758</p>
    </section>

    <section class="contact-main">
      <div class="contact-message">
        <h2>Have a question, suggestion, or feedback?</h2>
        <p>We’re always open to hearing from you...</p>
      </div>

      <div class="contact-form">

      {% if success %}

      <div class="success-message">
          Message submitted successfully!
      </div>

      {% endif %}


        <form action="/submit_contact" method="post">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Submit</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-logo">PRIZO</div>
    <nav>
      <ul>
        <li><a href="{{url_for('home')}}">Home</a></li>
        <li><a href="{{ url_for('about_page') }}">About</a></li>
        <li><a href="{{url_for('contact_page')}}">CONTACT</a></li>

      </ul>
    </nav>
  </footer>
</body>
</html>
