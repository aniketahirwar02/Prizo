<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIZO - Result Page</title>
  <link rel="stylesheet" href="../static/result_page.css">
  <link rel="stylesheet" href="../static/nav_footer.css">
</head>
<body>

<header>
  <div class="logo">PRIZO</div>

  <form action="/search" method="GET" class="search-bar">

    <input type="text" name="q" placeholder="Search">

    <button type="submit">Search</button>

  </form>
</header>


<main>

  <h1>Results for "{{ query }}"</h1>

  {% if products|length == 0 %}

    <p>No products found.</p>

  {% endif %}

  <div class="results-grid">

    {% for product in products %}

    <a href="/comparison_page/{{ product.id }}">

      <div class="product-card">

        <img
          src="{{ url_for('static', filename='images/' + product.image) }}"
        >

        <p>{{ product.name }}</p>

        <h2>₹{{ product.price }}</h2>

        <h3>{{ product.store }}</h3>

      </div>

    </a>

    {% endfor %}

  </div>

</main>

<footer>
  <div class="footer-logo">PRIZO</div>

  <nav>
    <ul>
      <li><a href="{{url_for('home')}}">Home</a></li>
      <li><a href="{{ url_for('about_page') }}">About</a></li>
      <li><a href="{{url_for('contact_page')}}">CONTACT</a></li>
    </ul>
  </nav>
</footer>

</body>
</html>
